<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Javier Bonilla: diseño de PCB, carcasas 3D y firmware embebido">
  <defs>
