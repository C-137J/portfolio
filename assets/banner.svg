  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- pistas de PCB (decoración) -->
  <g fill="none" stroke="#2dd4bf" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
