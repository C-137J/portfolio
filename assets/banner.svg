  <g stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="3" fill="#0b1220">
    <circle cx="820" cy="70" r="8"/>
    <circle cx="1250" cy="70" r="8"/>
    <circle cx="820" cy="150" r="8"/>
    <circle cx="1260" cy="180" r="8"/>
    <circle cx="840" cy="250" r="8"/>
    <circle cx="1250" cy="250" r="8"/>
